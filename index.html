<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ebe9e4" />
    <title>Folio</title>
    <style>
      .folio-boot {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #f5f3ef, #e5e3de 65%);
        color: #292823;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        text-align: center;
      }

      .folio-boot__page {
        display: grid;
        width: 54px;
        height: 68px;
        margin: 0 auto 22px;
        place-items: center;
        border: 1px solid #c6c2b9;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 12px 30px rgba(39, 36, 29, 0.12);
        font-family: Georgia, serif;
        font-size: 25px;
      }

      .folio-boot h1 {
        margin: 0 0 8px;
        font-family: Georgia, serif;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: -0.03em;
      }

      .folio-boot p {
        margin: 0;
        color: #77736b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="folio-boot">
        <div>
          <div class="folio-boot__page" aria-hidden="true">F</div>
          <h1>Markdown, ready for paper.</h1>
          <p>Start Folio with <code>npm run dev</code> to open a document.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
